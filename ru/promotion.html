<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/promotion.css">
    <script src="./js/common.js" defer></script>
    <script src="./js/promotion.js" defer></script>
    <script src="https://kit.fontawesome.com/2eb47fcd7e.js" crossorigin="anonymous"></script>
    <title>BGG</title>

<body>
    <header></header>
    <div class="country_selection"></div>
    <main>
        <section id="main_intro">
            <img src="../img/main.png" alt="">
            <div class="contact_btn_wrap"></div>
        </section>
        <!-- 페이지 헤더 -->
        <section id="promo_hero">
            <span class="section_label">АКЦИИ</span>
            <h2>АКЦИИ ПАРТНЁРОВ</h2>
            <p class="promo_desc">Откройте для себя специальные скидки, процедурные пакеты и ограниченные по времени предложения от проверенных партнёрских клиник.</p>
        </section>

        <!-- 필터 탭 -->
        <section id="promo_filter">
            <div class="filter_tabs" id="filter_tabs">
                <!-- JS로 동적 렌더 -->
            </div>
        </section>

        <!-- 프로모션 카드 그리드 -->
        <section id="promo_grid">
            <!-- JS로 동적 렌더 -->
        </section>

    <footer></footer>
