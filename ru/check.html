<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/check.css">
    <script src="./js/common.js"></script>
    <script src="./js/check.js"></script>
    <script src="https://kit.fontawesome.com/2eb47fcd7e.js" crossorigin="anonymous"></script>
    <title>BGG</title>
</head>
<body>
    <header></header>
    <div class="country_selection"></div>
    <main>
        <section id="check_section">
            <span class="section_label">CHECK</span>
            <h2>Reservation Status</h2>

            <div class="form_group">
                <input type="text" id="input_name" placeholder="Full Name">
                <input type="tel" id="input_phone" inputmode="numeric" placeholder="Phone Number (e.g. 010-0000-0000)">
            </div>

            <button class="book_btn" onclick="checkReservation()">Check Reservation</button>

            <div class="result_wrap" id="resultWrap">
                <div class="result_icon" id="resultIcon"></div>
                <div class="result_msg" id="resultMsg"></div>
                <div class="result_detail" id="resultDetail"></div>
            </div>
        </section>
    </main>

    <footer></footer>
</body>
</html>
