<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/request.css">
    <script src="./js/common.js" defer></script>
    <script src="./js/request.js" defer></script>
    <script src="https://kit.fontawesome.com/2eb47fcd7e.js" crossorigin="anonymous"></script>
    <title>BGG</title>
</head>

<body>
    <header></header>
    <div class="country_selection"></div>
    <main class="request_wrap">
        <section id="write_request">
            <span class="section_label">REQUEST</span>
            <h2>Request</h2>
            <div class="form_group">
                <input type="text" id="input_name" placeholder="Your Name">
                <input type="tel" id="input_phone" inputmode="numeric" placeholder="Phone Number">
                <input type="email" id="input_email" placeholder="Email">
                <input type="text" id="input_requesttitle" placeholder="Request Title">
                <textarea id="input_request" placeholder="Please share any questions or feedback you may have." rows="6"></textarea>
            </div>
            <button class="submit_btn" onclick="submitReview()">Submit Request</button>
        </section>
    </main>
    <footer></footer>
</body>

</html>
