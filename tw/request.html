<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/request.css">
    <script src="./js/common.js" defer></script>
    <script src="./js/request.js" defer></script>
    <script src="https://kit.fontawesome.com/2eb47fcd7e.js" crossorigin="anonymous"></script>
    <title>BGG</title>
</head>

<body>
    <header></header>
    <div class="country_selection"></div>
    <main class="request_wrap">
        <section id="write_request">
            <span class="section_label">立即諮詢</span>
            <h2>立即諮詢</h2>
            <div class="form_group">
                <input type="text" id="input_name" placeholder="您的姓名">
                <input type="tel" id="input_phone" inputmode="numeric" placeholder="電話號碼">
                <input type="email" id="input_email" placeholder="電子信箱">
                <input type="text" id="input_requesttitle" placeholder="諮詢標題">
                <textarea id="input_request" placeholder="請分享您的任何問題或回饋。" rows="6"></textarea>
            </div>
            <button class="submit_btn" onclick="submitReview()">送出諮詢</button>
        </section>
    </main>
    <footer></footer>
</body>

</html>
