<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGG</title>
    <script src="./js/common.js" defer></script>
    <script src="./js/reservation.js" defer></script>
    <link rel="stylesheet" href="../css/reservation.css">
    <script src="https://kit.fontawesome.com/2eb47fcd7e.js" crossorigin="anonymous"></script>
</head>

<body>
    <header></header>
    <div class="country_selection"></div>
    <main class="booking_wrap">
        <section id="booking_intro">
            <span class="section_label">預約</span>
            <h2 class="book_title">預約諮詢頁面</h2>
        </section>
        <!-- 진행 표시바 -->
        <div class="stepper_progress">
            <div class="prog_step active" id="prog_1">
                <div class="prog_dot"><i class="fa-solid fa-hospital"></i></div>
                <span>診所</span>
            </div>
            <div class="prog_line" id="prog_line_1"></div>
            <div class="prog_step" id="prog_2">
                <div class="prog_dot"><i class="fa-regular fa-calendar-days"></i></div>
                <span>預約時間</span>
            </div>
            <div class="prog_line" id="prog_line_2"></div>
            <div class="prog_step" id="prog_3">
                <div class="prog_dot"><i class="fa-solid fa-user"></i></div>
                <span>個人資料</span>
            </div>
        </div>

        <!-- Step 1: 병원 선택 -->
        <div class="step_panel active" id="step_panel_1">
            <div class="step_heading">
                <span class="section_label">第 1 步，共 3 步</span>
                <h2>選擇診所</h2>
                <p class="step_sub">選擇您想前往的診所。</p>
            </div>
            <div class="step_card">
                <div id="hospitalSelectWrap"></div>
            </div>
            <div class="step_nav">
                <span></span>
                <button class="nav_next" onclick="goToStep(2)">
                    下一步 &nbsp;<i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- Step 2: 날짜·시간 선택 -->
        <div class="step_panel" id="step_panel_2">
            <div class="step_heading">
                <span class="section_label">第 2 步，共 3 步</span>
                <h2>選擇日期與時間</h2>
                <p class="step_sub">請選擇方便的日期，並挑選可預約的時段。</p>
            </div>
            <div class="step_card date_time_layout">
                <div class="dt_calendar">
                    <div class="section_title"><i class="fa-regular fa-calendar"></i> 日期</div>
                    <div class="calendar_header">
                        <button id="prevMonth">&#8249;</button>
                        <span class="calendar_month" id="calendarTitle"></span>
                        <button id="nextMonth">&#8250;</button>
                    </div>
                    <div class="calendar_grid" id="calendarGrid"></div>
                </div>
                <div class="dt_divider"></div>
                <div class="dt_time">
                    <div class="section_title"><i class="fa-regular fa-clock"></i> 時間</div>
                    <div class="time_grid" id="timeGrid"></div>
                </div>
            </div>
            <div class="step_nav">
                <button class="nav_back" onclick="goToStep(1)">
                    <i class="fa-solid fa-arrow-left"></i>&nbsp; 返回
                </button>
                <button class="nav_next" onclick="goToStep(3)">
                    下一步 &nbsp;<i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- Step 3: 환자 정보 입력 -->
        <div class="step_panel" id="step_panel_3">
            <div class="step_heading">
                <span class="section_label">步驟 3／共 3 步</span>
                <h2>個人資料</h2>
                <p class="step_sub">即將完成預約，請填寫您的資料以完成預約流程。</p>
            </div>

            <!-- 예약 요약 -->
            <div class="booking_summary">
                <div class="summary_item">
                    <i class="fa-solid fa-hospital-user"></i>
                    <div class="summary_text">
                        <span class="summary_label">診所</span>
                        <span class="summary_val" id="summary_hospital">—</span>
                    </div>
                </div>
                <div class="summary_divider"></div>
                <div class="summary_item">
                    <i class="fa-regular fa-calendar-days"></i>
                    <div class="summary_text">
                        <span class="summary_label">日期</span>
                        <span class="summary_val" id="summary_date">—</span>
                    </div>
                </div>
                <div class="summary_divider"></div>
                <div class="summary_item">
                    <i class="fa-regular fa-clock"></i>
                    <div class="summary_text">
                        <span class="summary_label">時間</span>
                        <span class="summary_val" id="summary_time">—</span>
                    </div>
                </div>
                <button class="summary_edit" onclick="goToStep(2)" title="修改">
                    <i class="fa-solid fa-pen"></i> 修改
                </button>
            </div>

            <div class="step_card">
                <div class="form_group">
                    <div class="form_field">
                        <label for="input_name">姓名 <span class="req">*</span></label>
                        <input type="text" id="input_name" placeholder="請輸入您的完整姓名">
                    </div>
                    <div class="form_row">
                        <div class="form_field">
                            <label for="input_phone">電話號碼 <span class="req">*</span></label>
                            <input type="tel" id="input_phone" inputmode="numeric" placeholder="010-1234-5678">
                        </div>
                        <div class="form_field">
                            <label for="input_whatsapp">WhatsApp</label>
                            <input type="tel" id="input_whatsapp" inputmode="numeric" placeholder="選填">
                        </div>
                    </div>
                    <div class="form_row">
                        <div class="form_field">
                            <label for="input_nationality">國籍 <span class="req">*</span></label>
                            <input type="text" id="input_nationality" placeholder="您的國籍">
                        </div>
                        <div class="form_field">
                            <label for="input_email">電子信箱 <span class="req">*</span></label>
                            <input type="email" id="input_email" placeholder="your@email.com">
                        </div>
                    </div>
                    <div class="form_field">
                        <label for="input_treatment">希望進行的療程項目</label>
                        <input type="text" id="input_treatment" placeholder="e.g. Botox, Filler, Laser...">
                    </div>
                    <div class="form_field">
                        <label for="input_request">特殊需求</label>
                        <textarea id="input_request" placeholder="請填寫任何特殊需求或備註……" rows="4"></textarea>
                    </div>
                </div>
            </div>

            <div class="step_nav">
                <button class="nav_back" onclick="goToStep(2)">
                    <i class="fa-solid fa-arrow-left"></i>&nbsp; 返回
                </button>
                <button class="book_btn" onclick="submitBooking()">
                    <i class="fa-regular fa-calendar-plus"></i>
                    立即預約
                </button>
            </div>
            <div class="confirm_msg" id="confirmMsg"></div>
        </div>

    </main>
    <footer></footer>

    <!-- 예약 완료 알림 모달 -->
    <div id="bookingSuccessModal" class="res_modal_overlay" style="display:none;">
        <div class="res_modal_box success_modal_box">
            <div class="success_icon"><i class="fa-solid fa-circle-check"></i></div>
            <div class="res_modal_title">已收到您的預約申請，請稍候確認。</div>
            <p class="success_sub">已收到您的預約申請</p>
            <div class="success_details" id="successDetails"></div>
            <div class="res_modal_actions">
                <button class="res_modal_confirm" onclick="closeSuccessModal()">確認</button>
            </div>
        </div>
    </div>

    <!-- 예약 확인 모달 -->
    <div id="bookingConfirmModal" class="res_modal_overlay" style="display:none;">
        <div class="res_modal_box">
            <div class="res_modal_title">已收到您的預約申請</div>
            <div class="res_modal_body" id="resModalBody"></div>
            <div class="res_modal_actions">
                <button class="res_modal_cancel" onclick="closeBookingModal()">取消預約</button>
                <button class="res_modal_confirm" onclick="confirmBookingFinal()">確認預約</button>
            </div>
        </div>
    </div>
</body>

</html>
