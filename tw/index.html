<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/index.css">
    <script src="./js/common.js" defer></script>
    <script src="./js/index.js"></script>
    <script src="https://kit.fontawesome.com/2eb47fcd7e.js" crossorigin="anonymous"></script>
    <title>BGG</title>
</head>

<body>
    <header></header>
    <main>
        <section id="main_intro" data-header-theme="dark">
            <div class="hero_img_wrap">
                <div class="hero_slider">
                    <div class="hero_slide active"><img src="../img/Cheering.jpg" alt="main_img" class="hero_img"></div>
                    <div class="hero_slide"><img src="../img/pick_up.jpg" alt="pickup_img" class="hero_img"></div>
                    <div class="hero_slide"><img src="../img/translation.jpg" alt="translation_img" class="hero_img"></div>
                    <div class="hero_slide"><img src="../img/welcome.jpg" alt="welcomekits_img" class="hero_img"></div>
                </div>
                <div class="hero_dots">
                    <span class="hero_dot active"></span>
                    <span class="hero_dot"></span>
                    <span class="hero_dot"></span>
                    <span class="hero_dot"></span>
                </div>
                <div class="hero_overlay">
                <h2></h2>
                <p></p>
                </div>
            </div>
            <div class="contact_btn_wrap"></div>
        </section>

        <section id="service">
            <h2>SERVICE</h2>
            <div class="service_preview">
                <article class="service_box">
                    <div class="img_box"><img src="../img/9hbto5kf57k33vd0.png" alt=""></div>
                    <div class="text_box">
                        <h3>值得信賴的首爾皮膚科診所搜尋平台</h3>
                        <p>探索首爾值得信賴的皮膚科診所。BGG讓您輕鬆比較診所、選擇最適合的一家，並安心預約。</p>
                    </div>
                </article>
                <article class="service_box">
                    <div class="img_box"><img src="../img/9hbto5kf57k33vd0.png" alt=""></div>
                    <div class="text_box">
                        <h3>輕鬆找診所，無語言障礙</h3>
                        <p>BGG協助您探索首爾值得信賴的皮膚科診所，並在整趟旅程中提供語言支援，讓溝通更順暢。</p>
                    </div>
                </article>
                <article class="service_box">
                    <div class="img_box"><img src="../img/9hbto5kf57k33vd0.png" alt=""></div>
                    <div class="text_box">
                        <h3>24小時線上預約服務</h3>
                        <p>隨時找到值得信賴的首爾皮膚科診所並預約。BGG讓整個預約流程對國際訪客更快速、簡單且便利。</p>
                    </div>
                </article>
                <article class="service_box">
                    <div class="img_box"><img src="../img/9hbto5kf57k33vd0.png" alt=""></div>
                    <div class="text_box">
                        <h3>接送服務</h3>
                        <p>從抵達首爾到前往診所，BGG提供便利的接送服務，讓您在首爾享受無憂的美麗體驗。</p>
                    </div>
                </article>
            </div>
        </section>

        <section id="partner">
            <h2>PARTNERS</h2>
            <div class="hospital_list_wrap">
            </div>
            <a href="./partner.html" class="more_btn">查看所有合作診所</a>
        </section>
    </main>
    <footer></footer>

    <!-- 팝업 (JS로 동적 생성) -->
    <div id="popup_container"></div>
    <div class="country_selection"></div>
</body>

</html>
