<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/booking.css">
    <script src="./js/common.js" defer></script>
    <script src="https://kit.fontawesome.com/2eb47fcd7e.js" crossorigin="anonymous"></script>
    <title>BGG</title>
</head>

<body>
    <header></header>
    <div class="country_selection"></div>
    <main>
        <section id="booking_hero">
            <span class="section_label">線上預約</span>
            <h2>24 小時線上預約</h2>
            <p class="booking_sub">請選擇服務類別，開始進行預約。</p>
        </section>

        <section id="booking_categories">
            <div class="booking_layout">
                <div class="service_cards">
                <article class="category_card">
                    <div class="card_icon">
                        <i class="fa-solid fa-user-doctor"></i>
                    </div>
                    <div class="card_content">
                        <span class="card_tag">手術</span>
                        <h3>整形外科</h3>
                    </div>
                </article>

                <article class="category_card">
                    <div class="card_icon">
                        <i class="fa-solid fa-hand-sparkles"></i>
                    </div>
                    <div class="card_content">
                        <span class="card_tag">醫療項目</span>
                        <h3>皮膚科療程</h3>
                    </div>
                </article>

                <article class="category_card">
                    <div class="card_icon">
                        <i class="fa-solid fa-spa"></i>
                    </div>
                    <div class="card_content">
                        <span class="card_tag">美學療程</span>
                        <h3>肌膚管理診所</h3>
                    </div>
                </article>

                <article class="category_card">
                    <div class="card_icon">
                        <i class="fa-solid fa-heart-pulse"></i>
                    </div>
                    <div class="card_content">
                        <span class="card_tag">健康管理</span>
                        <h3>健康檢查</h3>
                    </div>
                </article>

                <article class="category_card">
                    <div class="card_icon">
                        <i class="fa-solid fa-paintbrush"></i>
                    </div>
                    <div class="card_content">
                        <span class="card_tag">美容管理</span>
                        <h3>半永久彩妝</h3>
                    </div>
                </article>
                </div>

                <article class="category_card card_cta">
                    <div class="card_icon">
                        <i class="fa-solid fa-circle-question"></i>
                    </div>
                    <div class="card_content">
                        <span class="card_tag">顧客支援</span>
                        <h3>不知道該選擇哪個療程嗎？</h3>
                        <p>歡迎隨時聯繫我們的英語服務團隊，我們將協助您找到最適合的診所。</p>
                    </div>
                    <a href="https://api.whatsapp.com/" target="_blank" class="card_book_btn cta_btn">
                        免費諮詢 <i class="fa-brands fa-whatsapp"></i>
                    </a>
                </article>
            </div>
        </section>

        <section id="booking_contact">
            <div class="contact_strip">
                <div class="contact_item">
                    <i class="fa-solid fa-phone"></i>
                    <div>
                        <span class="contact_label">電話</span>
                        <a href="tel:+821055371167">+82-10-1234-4567</a>
                    </div>
                </div>
                <div class="contact_divider"></div>
                <div class="contact_item">
                    <i class="fa-solid fa-envelope"></i>
                    <div>
                        <span class="contact_label">電子信箱</span>
                        <a href="mailto:hospitalaroundyou@gmail.com">contact@example.com</a>
                    </div>
                </div>
                <div class="contact_divider"></div>
                <div class="contact_item">
                    <i class="fa-brands fa-whatsapp"></i>
                    <div>
                        <span class="contact_label">WhatsApp</span>
                        <a href="https://api.whatsapp.com" target="_blank">24 小時服務</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer></footer>
</body>

</html>
