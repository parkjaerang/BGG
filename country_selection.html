<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGG Admin – Country Selection</title>
    <link rel="stylesheet" href="./css/common.css">
    <script src="https://kit.fontawesome.com/2eb47fcd7e.js" crossorigin="anonymous"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--white);
            font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
            color: #fff;
        }

        .cs_wrap {
            text-align: center;
            padding: 40px 24px;
        }

        .cs_logo {
            font-size: 13px;
            letter-spacing: 4px;
            color: #c9a84c;
            margin-bottom: 8px;
        }

        .cs_title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 4px;
            color: var(--black);
        }

        .cs_sub {
            font-size: 13px;
            color: #888;
            margin-bottom: 48px;
        }

        .cs_cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cs_card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 200px;
            padding: 36px 24px 28px;
            background: var(--white);
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            color: var(--black);
            transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
        }

        .cs_card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(97, 97, 97, 0.404);
        }

        .cs_flag {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
        }

        .cs_flag_emoji {
            font-size: 52px;
            line-height: 1;
        }

        .cs_country_name {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--black);
        }

        .cs_country_sub {
            font-size: 11px;
            color: #666;
            letter-spacing: 0.5px;
        }

        .cs_footer {
            margin-top: 48px;
            font-size: 11px;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="cs_wrap">
        <div class="cs_logo">BGG ADMIN</div>
        <h1 class="cs_title">Country Selection</h1>
        <p class="cs_sub">관리할 국가 페이지를 선택하세요</p>

        <div class="cs_cards">
            <!-- English -->
            <a class="cs_card" href="./admin.html">
                <img class="cs_flag" src="./img/english.png" alt="English" onerror="this.outerHTML='<span class=\'cs_flag_emoji\'>EN</span>'">
                <div>
                    <div class="cs_country_name">English</div>
                    <div class="cs_country_sub">영미권 · EN</div>
                </div>
            </a>
        </div>

        <p class="cs_footer">병원 목록 · 예약 데이터를 관리합니다</p>
    </div>
</body>
</html>
